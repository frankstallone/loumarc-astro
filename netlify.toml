[build]
  base = "astro"
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/forms/*"
  function = "forms-gate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/cap/:splat"
  status = 200
