[build]
  base = "."
  publish = "dist"
  command = "npm run build"
  edge_functions = "netlify/edge-functions"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/challenge"
  to = "/.netlify/functions/cap/challenge"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 20
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/redeem"
  to = "/.netlify/functions/cap/redeem"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 20
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/validate"
  to = "/.netlify/functions/cap/validate"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]
